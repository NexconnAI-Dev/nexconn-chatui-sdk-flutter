name: ai_nexconn_chatui_plugin
description: A Flutter UI package for Nexconn Chat conversations and messages.
version: 26.2.10
homepage: https://github.com/NexconnAI-Dev/nexconn-chatui-sdk-flutter

environment:
  sdk: ^3.9.2
  flutter: ">=3.29.2"

dependencies:
  flutter:
    sdk: flutter
  ai_nexconn_chat_plugin: 26.2.10
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  flutter_slidable: ^4.0.0
  scrollable_positioned_list: ^0.3.8
  flutter_linkify: ^6.0.0
  visibility_detector: ^0.4.0+2
  audio_session: ^0.2.3
  just_audio: ^0.10.3
  record: ^6.0.0
  video_player: ^2.9.5
  photo_view: ^0.15.0
  image_gallery_saver_plus: ^4.0.1
  image_size_getter: ^2.4.1
  wechat_assets_picker: ^10.0.0
  wechat_camera_picker: ^4.4.0
  photo_manager: ^3.8.3
  path_provider: ^2.1.5
  file_picker: ^10.1.9
  permission_handler: ^12.0.0+1
  # 12.4.0 calls NSProcessInfo.isiOSAppOnVision, which is unavailable on
  # older Xcode SDKs used by current iOS builds.
  device_info_plus: ">=12.1.0 <12.4.0"
  url_launcher: ^6.3.1
  flutter_local_notifications: ^19.0.0
  dio: ^5.7.0
  shared_preferences: ^2.5.3
  xml: ^6.5.0
  share_plus: ^12.0.0
  mime: ^2.0.0
  rongcloud_im_wrapper_plugin: 5.32.8
  video_player_media_kit: ^2.0.0
  media_kit_libs_android_video: ^1.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: ai.nexconn.ai_nexconn_chatui_plugin
        pluginClass: AiNexconnChatUIPlugin
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/NexconnLightIcon/
    - assets/NexconnDarkIcon/
